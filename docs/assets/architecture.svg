<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 420" width="980" height="420" role="img" aria-labelledby="title desc">
  <title id="title">p2p-ai-langraph architecture</title>
  <desc id="desc">HTTP and Celery drive a LangGraph hexagon through seven ports. HITL approve runs send off the inbound spine.</desc>
  <rect width="980" height="420" fill="#f7f6f3"/>
  <text x="24" y="36" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f1f1f">LangGraph P2P AP assistant  no Streamlit</text>
  <text x="24" y="56" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#5c5c5c">Inbound graph ends at HITL. Approve calls send. Resolution retry is off unless flagged.</text>

  <rect x="24" y="80" width="200" height="300" rx="8" fill="#fff" stroke="#1f1f1f" stroke-width="1.5"/>
  <text x="40" y="106" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f1f1f">Driving</text>
  <rect x="40" y="122" width="168" height="36" rx="4" fill="#e8e6e1"/>
  <text x="52" y="144" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f1f1f">curl / HTTP client</text>
  <rect x="40" y="168" width="168" height="52" rx="4" fill="#e8e6e1"/>
  <text x="52" y="190" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f1f1f">FastAPI</text>
  <text x="52" y="208" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5c5c5c">/webhook /tickets /approve</text>
  <rect x="40" y="232" width="168" height="52" rx="4" fill="#e8e6e1"/>
  <text x="52" y="254" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f1f1f">Redis + Celery</text>
  <text x="52" y="272" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5c5c5c">inbound graph only</text>
  <rect x="40" y="296" width="168" height="52" rx="4" fill="#e8e6e1"/>
  <text x="52" y="318" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f1f1f">HitlService</text>
  <text x="52" y="336" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5c5c5c">approve ’ send node</text>

  <rect x="248" y="80" width="460" height="300" rx="8" fill="#fff" stroke="#1f1f1f" stroke-width="1.5"/>
  <text x="264" y="106" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f1f1f">Core  WorkflowDeps closed in node factories</text>
  <rect x="264" y="122" width="428" height="70" rx="4" fill="#1f1f1f"/>
  <text x="276" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#f7f6f3">ingest ’ security ’ thread ’ triage ’ intent</text>
  <text x="276" y="170" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#f7f6f3">’ sender ’ routing ’ resolution ’ draft ’ hitl</text>
  <text x="264" y="220" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5c5c5c">7 ports (never stored in graph state)</text>
  <rect x="264" y="232" width="90" height="28" rx="4" fill="#e8e6e1"/><text x="276" y="250" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f1f1f">Email</text>
  <rect x="360" y="232" width="90" height="28" rx="4" fill="#e8e6e1"/><text x="372" y="250" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f1f1f">Tickets</text>
  <rect x="456" y="232" width="90" height="28" rx="4" fill="#e8e6e1"/><text x="468" y="250" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f1f1f">LLM</text>
  <rect x="552" y="232" width="90" height="28" rx="4" fill="#e8e6e1"/><text x="564" y="250" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f1f1f">SAP</text>
  <rect x="264" y="268" width="90" height="28" rx="4" fill="#e8e6e1"/><text x="276" y="286" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f1f1f">Audit</text>
  <rect x="360" y="268" width="90" height="28" rx="4" fill="#e8e6e1"/><text x="372" y="286" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f1f1f">Senders</text>
  <rect x="456" y="268" width="90" height="28" rx="4" fill="#e8e6e1"/><text x="468" y="286" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#1f1f1f">Drafts</text>
  <text x="264" y="328" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5c5c5c">DELEGATE / quarantine / discard stop early. MINE continues to HITL.</text>
  <text x="264" y="348" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5c5c5c">Never auto-send. CONFIDENCE_THRESHOLD unused for send.</text>

  <rect x="732" y="80" width="224" height="300" rx="8" fill="#fff" stroke="#1f1f1f" stroke-width="1.5"/>
  <text x="748" y="106" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f1f1f">Adapters</text>
  <rect x="748" y="122" width="192" height="36" rx="4" fill="#e8e6e1"/>
  <text x="760" y="144" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f1f1f">Postgres + Alembic</text>
  <rect x="748" y="168" width="192" height="36" rx="4" fill="#e8e6e1"/>
  <text x="760" y="190" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f1f1f">Mock SAP / senders</text>
  <rect x="748" y="214" width="192" height="36" rx="4" fill="#e8e6e1"/>
  <text x="760" y="236" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f1f1f">Mock LLM (eval fixtures)</text>
  <rect x="748" y="260" width="192" height="36" rx="4" fill="#e8e6e1"/>
  <text x="760" y="282" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#1f1f1f">Memory stores in tests</text>
  <text x="748" y="330" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5c5c5c">Live Nylas / SAP / OCR</text>
  <text x="748" y="348" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#5c5c5c">are out of scope.</text>
</svg>
